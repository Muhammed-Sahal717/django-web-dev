{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Student Management{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-container">
        <div class="nav-brand">
          <a href="{% url 'student_form' %}" class="brand-link">CampusDesk</a>
        </div>
        <nav class="nav-links">
          <a href="{% url 'student_form' %}" class="nav-item">Students</a>
          <a href="{% url 'student_queries' %}" class="nav-item">ORM Queries</a>
        </nav>
        <div class="nav-auth">
          {% if user.is_authenticated %}
          <span class="user-badge">{{ user.username }}</span>
          <form method="POST" action="{% url 'logout' %}" class="inline-form">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline btn-sm">Logout</button>
          </form>
          {% else %}
          <a href="{% url 'login' %}" class="btn btn-ghost btn-sm">Login</a>
          <a href="{% url 'register' %}" class="btn btn-primary btn-sm"
            >Register</a
          >
          {% endif %}
        </div>
      </div>
    </header>

    <main class="container">{% block content %}{% endblock %}</main>
  </body>
</html>
